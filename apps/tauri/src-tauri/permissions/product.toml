# Product commands are granted only to the exact main WebView.
[[permission]]
identifier = "allow-product-commands"
description = "Existing trusted product operations; no executor access."
commands.allow = [
  "runtime_capabilities",
  "resource_cache_snapshot",
  "resource_cache_configure",
  "resource_cache_clear",
  "resource_cache_directory",
  "register_artwork",
  "account_snapshot",
  "account_usage",
  "acquire_account_usage",
  "release_account_usage",
  "cancel_platform_requests",
  "create_account",
  "update_account",
  "remove_account",
  "discard_account_draft",
  "source_account_platforms",
  "source_account_auth",
  "save_proxy",
  "remove_proxy",
  "request_state",
  "save_product_data",
  "load_product_data",
  "plugin_authority_snapshot",
  "plugin_authority_revoke",
  "plugin_package_preview",
  "plugin_package_discard_preview",
  "plugin_package_current_preview",
  "plugin_package_pick_preview",
  "plugin_package_url_preview",
  "plugin_dev_begin",
  "plugin_dev_end",
  "begin_browser_login",
  "complete_browser_login",
  "cancel_browser_login",
  "http_request",
  "cancel_request",
  "douyin_catalog_request",
