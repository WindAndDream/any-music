name: iOS build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: iOS arm64 simulator build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: ios-arm64-simulator
      - name: Initialize the Xcode project and build without signing
        run: |
          rustup target add aarch64-apple-ios-sim
          pnpm --filter @any-music/tauri tauri ios init --ci --skip-targets-install
          pnpm --filter @any-music/tauri tauri ios build --ci --target aarch64-sim --no-sign -- --locked --no-default-features
      - name: Archive the simulator app
        run: |
          set -- apps/tauri/src-tauri/gen/apple/build/*/*.app
          test "$#" -eq 1
          test -d "$1"
          ditto -c -k --keepParent "$1" ios-arm64-simulator.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-arm64-simulator
          path: ios-arm64-simulator.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
